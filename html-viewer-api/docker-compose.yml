# Optional: Azurite in Docker. The default is `./start.sh`, which runs it with npx.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: >
      azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
      --location /data --skipApiVersionCheck --loose
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:
